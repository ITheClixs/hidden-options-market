[project]
name = "hidden-options-market"
version = "0.2.0"
description = "The hidden options market: OCC FLEX clearing data as a panel, measured and decoded"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "tenacity>=8.3",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "linearmodels>=6.0",
    "mypy>=1.11",
    "pandas-stubs",
    "scipy-stubs",
    "types-requests",
]

[project.scripts]
hidden-options = "hidden_options.cli:main"
# Legacy name, still called by scheduled jobs; removed once they use `hidden-options collect`.
absorb-collect = "hidden_options.cli:collect_alias"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hidden_options"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-local-folder = ["run_stage1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
# Bare `dict` and `list` annotations read better than `dict[str, Any]` in pandas code.
disallow_any_generics = false
