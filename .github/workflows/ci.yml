# Lint, types, tests and the paper-number drift check, on committed files only.
#
# `data/` is git-ignored, so none of the raw captures exist here; the tests run on the
# fixtures in tests/fixtures/ and `hidden-options check` re-renders paper/numbers.tex,
# paper/tables/ and README.md from the committed results/ alone.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,paper]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy src/hidden_options

      - name: Tests
        run: pytest --cov=hidden_options --cov-fail-under=90

      - name: Paper numbers match results/
        run: hidden-options check
