name: daily-capture

# The three upstream sources are snapshots with no retrievable history: Cboe serves
# the current chain, OCC the current open interest, and issuers overwrite holdings
# files in place. A trading day that is not captured is lost permanently, which is
# why this runs on a schedule rather than on demand.
#
# Captures are stored as GitHub Release assets, not committed. Release assets do not
# count against repository size, so the full-fidelity capture (~15 MB/day) can be
# kept without trimming and without bloating the repo.

on:
  schedule:
    # 23:30 UTC Mon-Fri. GitHub cron is UTC and does not observe DST, so this is
    # 19:30 ET in summer and 18:30 ET in winter — comfortably after the US close in
    # both, and before issuers refresh holdings files overnight.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources (holdings,cboe,occ)"
        required: false
        default: "holdings,cboe,occ"

# Never let two captures overlap: concurrent collectors draw throttling from the free
# endpoints, which is how symbol-days get lost.
concurrency:
  group: daily-capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e .

      - name: Capture
        id: capture
        run: |
          set -o pipefail
          absorb-collect --root data/raw 2>&1 | tee capture.log
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Verify the capture is usable
        run: |
          python - <<'PY'
          import glob, json, sys

          manifests = sorted(glob.glob("data/raw/manifests/*.json"))
          if not manifests:
              sys.exit("No manifest written; the collector did not run")

          summary = json.load(open(manifests[-1]))
          ok, attempted = summary["n_ok"], summary["n_attempted"]
          print(f"{ok}/{attempted} snapshots, {summary['total_rows']:,} rows")

          # A capture that lost most symbols is worse than useless: it looks like data.
          # Fail loudly so the gap is noticed while the day can still be re-run.
          if attempted == 0 or ok / attempted < 0.80:
              for outcome in summary["outcomes"]:
                  if outcome["status"] != "ok":
                      print("FAILED", outcome["source"], outcome["symbol"], outcome["detail"][:120])
              sys.exit(f"Only {ok}/{attempted} snapshots captured; refusing to publish")
          PY

      - name: Package
        run: |
          tar --use-compress-program="zstd -19 -T0" \
              -cf "absorb-raw-${{ steps.capture.outputs.day }}.tar.zst" \
              -C data raw
          ls -lh absorb-raw-*.tar.zst

      # One release per month keeps the release list navigable while each day stays a
      # separately downloadable asset.
      - name: Publish to the monthly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-${{ steps.capture.outputs.month }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Raw captures ${{ steps.capture.outputs.month }}" \
              --notes "Daily snapshots of Cboe option chains, OCC series open interest and issuer ETF holdings. One asset per trading day. Generated by the daily-capture workflow." \
              --latest=false
          fi
          gh release upload "$TAG" \
            "absorb-raw-${{ steps.capture.outputs.day }}.tar.zst" --clobber

      # Kept for 90 days as a safety net in case a release upload fails silently.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: capture-log-${{ steps.capture.outputs.day }}
          path: |
            capture.log
            data/raw/manifests/
          retention-days: 90
